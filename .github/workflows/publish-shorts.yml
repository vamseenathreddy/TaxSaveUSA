name: publish-shorts

# PAUSED: no schedule trigger, so this only runs when started by hand.
# To resume automatic posting (6 random-time Shorts/day, one inside each
# 4-hour window in config/rollout.json), uncomment the schedule block
# below and re-enable the workflow in the repo's Actions settings.
# Idle ticks only run the tiny "decide" step and exit; this repo is
# public, so Actions minutes are free.
on:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "What to post when run by hand: auto | trending | tax"
        required: false
        default: "auto"
      force:
        description: "Post now regardless of the schedule (true/false)"
        required: false
        default: "false"

permissions:
  contents: write  # needed to commit state/ and content/topics.json (used flags) back, and to create/delete the temporary Release used to host the video for Instagram

concurrency:
  group: publish-shorts
  cancel-in-progress: false  # never cancel a run mid-upload

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # used by the gh CLI for the temporary Instagram-hosting release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether this tick should publish
        # Runs first and needs only the standard library (+ tzdata), so a
        # tick with nothing due finishes in seconds without installing
        # ffmpeg or any Python packages.
        id: decide
        run: |
          pip install --quiet tzdata
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "result=fire" >> "$GITHUB_OUTPUT"
          else
            result=$(python3 scripts/scheduler.py)
            echo "result=$result" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python deps
        if: steps.decide.outputs.result == 'fire'
        run: |
          pip install --break-system-packages tzdata google-auth google-auth-oauthlib google-api-python-client edge-tts requests

      - name: Install ffmpeg and fonts
        # fonts-dejavu-core provides the bold sans-serif font the video
        # renderer needs for the caption text, hook headline, and
        # subscribe banner (see resolve_caption_font() in
        # generate_video.py) - without it, ffmpeg's drawtext/subtitles
        # filters silently draw NO TEXT instead of failing. fc-cache
        # refreshes the font cache so the font is immediately visible.
        if: steps.decide.outputs.result == 'fire'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
          fc-cache -f

      - name: Generate video
        if: steps.decide.outputs.result == 'fire'
        run: python3 scripts/generate_video.py --source "${{ inputs.source || 'auto' }}" > build_meta.txt

      - name: Parse build metadata
        if: steps.decide.outputs.result == 'fire'
        run: |
          title=$(grep '^title:' build_meta.txt | cut -d' ' -f2-)
          description_raw=$(grep '^description:' build_meta.txt | cut -d' ' -f2-)
          description=$(printf '%b' "$description_raw")
          video_path=$(grep '^rendered:' build_meta.txt | cut -d' ' -f2-)
          tags=$(grep '^tags:' build_meta.txt | cut -d' ' -f2-)
          playlist=$(grep '^playlist:' build_meta.txt | cut -d' ' -f2-)
          {
            echo "TITLE=$title"
            echo "VIDEO_PATH=$video_path"
            echo "TAGS=$tags"
            echo "PLAYLIST=$playlist"
            echo "DESCRIPTION<<DESC_EOF"
            echo "$description"
            echo "DESC_EOF"
          } >> "$GITHUB_ENV"

      - name: Upload to YouTube
        if: steps.decide.outputs.result == 'fire'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 scripts/upload_to_youtube.py \
            --video "$VIDEO_PATH" \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --tags "$TAGS" \
            --playlist "$PLAYLIST"

      - name: Host video temporarily for Instagram
        if: steps.decide.outputs.result == 'fire'
        id: host
        run: |
          tag="reel-${{ github.run_id }}-${{ github.run_attempt }}"
          filename=$(basename "$VIDEO_PATH")
          gh release create "$tag" "$VIDEO_PATH" \
            --title "Temporary Reel hosting" \
            --notes "Auto-created so Instagram's API can fetch this video. Deleted automatically after publish."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$tag/$filename" >> "$GITHUB_ENV"
          sleep 10  # brief propagation buffer before Instagram fetches it

      - name: Publish to Instagram
        if: steps.decide.outputs.result == 'fire'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 scripts/upload_to_instagram.py \
            --video-url "$VIDEO_URL" \
            --caption "$TITLE

          $DESCRIPTION"

      - name: Clean up temporary Instagram hosting release
        if: always() && steps.host.outputs.tag != ''
        run: gh release delete "${{ steps.host.outputs.tag }}" --yes --cleanup-tag || true

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "shorts-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ content/topics.json content/comment_prompts.json
          git diff --cached --quiet || git commit -m "chore: update scheduler state / consumed topic queue"
          git pull --rebase origin main || true
          git push
