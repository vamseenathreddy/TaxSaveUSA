name: weekly-review

# Every Monday: reads the channel's numbers (Data API), writes reports/LATEST.md with flags first, and commits it.
on:
  schedule:
    - cron: "5 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-review

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --break-system-packages google-auth google-auth-oauthlib google-api-python-client
      - name: Build the review
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/weekly_review.py
      - name: Commit the review
        run: |
          git config user.name "weekly-review"
          git config user.email "noreply@github.com"
          git add reports
          git diff --cached --quiet || git commit -m "weekly review $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main
